
services:
  app:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    container_name: batch_importer_composer_cli
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true

  composer:
    image: composer:latest
    container_name: batch_importer_composer
    volumes:
      - .:/app
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"